# brickpick/config/arm_presets.yaml
arm_preset_node:
  ros__parameters:
    
    
    presets.home.x: 0.088
    presets.home.z: 0.151

    presets.forward.x: 0.203
    presets.forward.z: 0.061

    presets.down.x: 0.0
    presets.down.z: -0.08

    presets.backward.x: 0.082
    presets.backward.z: 0.061
    
    
    
   
    # default_speed: 0.25             
    use_relative: false             
    goal_timeout: 5.0               
    
    
    position_limits.x.min: -0.06
    position_limits.x.max: 0.23
    position_limits.z.min: -0.12
    position_limits.z.max: 0.23

    emergency_stop_on_error: true   
    
    
    default_sequence: ["home", "forward", "backward" ,"home"]